name: Codex → Claude review cycle

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_run:
    # Subscribe broadly; the trusted API/profile gate below rejects unrelated,
    # stale and cross-repository runs before any privileged model/publish step.
    workflows: ['*']
    types: [completed]

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: codex-claude-cycle-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
  # Preserve pending review/CI/owner-response events instead of replacing one.
  # GitHub caps this queue at 100; overflow still needs manual inspection.
  queue: max
  cancel-in-progress: false

jobs:
  cycle:
    if: >-
      github.event.repository.owner.login == 'pangin' &&
      github.event.repository.fork == false &&
      github.event.repository.archived == false &&
      ((github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
        github.event.review.user.id == 199175422 &&
        github.event.sender.login == 'chatgpt-codex-connector[bot]' &&
        github.event.pull_request.user.login == 'pangin' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0].number > 0) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'pangin'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout trusted default-branch controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # Keep pinned criteria commits available across rounds.
          persist-credentials: false

      - name: Preserve trusted control code outside the model workspace
        id: trusted
        run: |
          if [ ! -e .github/review-cycle ]; then
            echo 'enrolled=false' >> "$GITHUB_OUTPUT"
            echo 'Trusted default branch is not enrolled yet; setup PR event skipped without inference or publishing.'
            exit 0
          fi
          test -f .github/review-cycle/cloud_controller.py
          test -f .github/review-cycle/config.json
          cp -R .github/review-cycle "$RUNNER_TEMP/review-cycle"
          chmod +x "$RUNNER_TEMP/review-cycle/git_askpass.py"
          echo 'enrolled=true' >> "$GITHUB_OUTPUT"

      - name: Record an authorized human direction
        if: steps.trusted.outputs.enrolled == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/review-cycle/cloud_controller.py" respond

      - name: Verify current review or CI and reserve a bounded assessment
        id: prepare
        if: steps.trusted.outputs.enrolled == 'true' && github.event_name != 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_APP_ID: ${{ vars.REVIEW_CYCLE_APP_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.REVIEW_CYCLE_APP_PRIVATE_KEY != '' }}
        run: python3 "$RUNNER_TEMP/review-cycle/cloud_controller.py" prepare

      - name: Checkout the exact reviewed PR head
        if: steps.prepare.outputs.run_claude == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.prepare.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Official Claude assessment with mode-specific confined file tools
        id: claude
        if: steps.prepare.outputs.run_claude == 'true'
        # The standalone action does not configure GitHub authentication in the
        # model's checkout. The trusted controller owns all GitHub operations.
        uses: anthropics/claude-code-action/base-action@fd1c128679612beff4ca259c78021c506e8aa7a7
        timeout-minutes: 30
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prepare.outputs.claude_prompt }}
          claude_args: ${{ steps.prepare.outputs.claude_args }}
          show_full_output: 'false'

      - name: Validate actual edits and run credential-free trusted tests
        id: tests
        if: steps.prepare.outputs.run_claude == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: python3 "$RUNNER_TEMP/review-cycle/cloud_controller.py" test

      # Create write authority only AFTER testing; it is never passed to Claude
      # or the test container. App-authored pushes trigger normal GitHub CI.
      - name: Create a repository-scoped publisher token
        id: publisher
        if: steps.tests.outputs.publish == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.REVIEW_CYCLE_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_CYCLE_APP_PRIVATE_KEY }}
          owner: pangin
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish a normal commit to the same PR; wait for Codex re-review
        if: steps.tests.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: python3 "$RUNNER_TEMP/review-cycle/cloud_controller.py" publish

      - name: Record a stopped or failed attempt
        if: always() && steps.prepare.outputs.run_claude == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/review-cycle/cloud_controller.py" failure
